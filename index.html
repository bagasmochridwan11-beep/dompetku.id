    <script>
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
      (function() {
        const _origConsoleError = console.error;
        console.error = function(...args) {
          if (args.length > 0) {
            const first = args[0];
            if (typeof first === 'string' && (first === '[vite]' || first.startsWith('[vite]'))) {
              // Ignore HMR / WebSocket connection errors per environment constraints
              return;
            }
          }
          _origConsoleError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (e.target && (e.target instanceof WebSocket || e.target.nodeName === 'WEBSOCKET')) {
            e.preventDefault();
            e.stopPropagation();
          }
          if (e.message && (e.message.includes('[vite]') || e.message.includes('WebSocket') || e.message.includes('websocket'))) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          const reason = e.reason;
          if (reason && (
            (typeof reason === 'string' && reason.includes('[vite]')) ||
            (reason.message && reason.message.includes('[vite]')) ||
            (reason instanceof Event && reason.type === 'error')
          )) {
            e.preventDefault();
            e.stopPropagation();
          }
        });
      })();
    </script>
