<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="dompetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#dompetGrad)" />

  <!-- Wallet Body -->
  <g filter="url(#shadow)">
    <!-- Base Wallet Shape -->
    <rect x="96" y="160" width="320" height="220" rx="32" fill="#064e3b" />
    <rect x="96" y="140" width="320" height="220" rx="32" fill="#047857" />

    <!-- Card/Bill sticking out -->
    <rect x="136" y="110" width="240" height="90" rx="16" fill="#ecfdf5" opacity="0.9" />
    <line x1="160" y1="135" x2="240" y2="135" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
    <line x1="160" y1="155" x2="310" y2="155" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" />

    <!-- Wallet Flap & Clasp -->
    <rect x="96" y="160" width="320" height="200" rx="32" fill="#059669" />
    <!-- Clasp Tab -->
    <path d="M 330 220 L 416 220 C 430 220 440 232 440 246 L 440 274 C 440 288 430 300 416 300 L 330 300 Z" fill="#047857" />
    <!-- Golden Snap Button with Coin Emblem -->
    <circle cx="396" cy="260" r="18" fill="url(#goldGrad)" />
    <circle cx="396" cy="260" r="12" fill="#d97706" />
    <text x="396" y="266" font-size="16" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">Rp</text>
  </g>
</svg>
